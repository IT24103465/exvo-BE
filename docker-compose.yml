services:
  mysql-dev:
    profiles: ["local"]
    image: mysql:8.0
    container_name: exvo_mysql_dev
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: exvo_auth_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d

  kafka:
    image: apache/kafka:4.0.0
    container_name: exvo_kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - kafka_data:/var/lib/kafka/data

  authservice:
    build:
      context: .
      dockerfile: src/services/AuthService/Dockerfile
    container_name: exvo_authservice
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      EXVO_AUTH_MYSQL_CONNECTION_STRING: "Server=${AZURE_MYSQL_HOST:-exvo-db.mysql.database.azure.com};Port=${AZURE_MYSQL_PORT:-3306};Database=exvo_auth_db;User ID=${AZURE_MYSQL_USER:-exvoadmin};Password=${AZURE_MYSQL_PASSWORD:?Set AZURE_MYSQL_PASSWORD in .env.local or the shell};SslMode=Required;"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5284:8080"

  catalogservice:
    build:
      context: .
      dockerfile: src/services/CatalogService/Dockerfile
    container_name: exvo_catalogservice
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      EXVO_CATALOG_MYSQL_CONNECTION_STRING: "Server=${AZURE_MYSQL_HOST:-exvo-db.mysql.database.azure.com};Port=${AZURE_MYSQL_PORT:-3306};Database=exvo_catalog_db;User ID=${AZURE_MYSQL_USER:-exvoadmin};Password=${AZURE_MYSQL_PASSWORD:?Set AZURE_MYSQL_PASSWORD in .env.local or the shell};SslMode=Required;"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5255:8080"

  bookingservice:
    build:
      context: .
      dockerfile: src/services/BookingService/Dockerfile
    container_name: exvo_bookingservice
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      EXVO_BOOKING_MYSQL_CONNECTION_STRING: "Server=bookingdb;Port=3306;Database=exvo_booking_db;User=bookinguser;Password=${AZURE_MYSQL_PASSWORD:?Set AZURE_MYSQL_PASSWORD in .env.local or the shell};SslMode=None"
      CatalogService__BaseUrl: http://catalogservice:8080
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__UserName: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__From: ${EMAIL_FROM:-tickets@exvo.local}
      Email__EnableSsl: ${EMAIL_ENABLE_SSL:-true}
      Email__PickupDirectory: ${EMAIL_PICKUP_DIRECTORY:-notifications-outbox}
    depends_on:
      bookingdb:
        condition: service_healthy
    ports:
      - "5266:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  bookingdb:
    image: mysql:8.0
    container_name: exvo_bookingdb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${AZURE_MYSQL_PASSWORD:?Set AZURE_MYSQL_PASSWORD in .env.local or the shell}"
      MYSQL_DATABASE: exvo_booking_db
      MYSQL_USER: bookinguser
      MYSQL_PASSWORD: "${AZURE_MYSQL_PASSWORD:?Set AZURE_MYSQL_PASSWORD in .env.local or the shell}"
    ports:
      - "3307:3306"
    volumes:
      - booking_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysqladmin ping -h localhost -u\"$$MYSQL_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  apigateway:
    build:
      context: .
      dockerfile: src/gateway/ApiGateway/Dockerfile
    container_name: exvo_apigateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ReverseProxy__Clusters__auth-cluster__Destinations__authServiceDestination__Address: http://authservice:8080
      ReverseProxy__Clusters__catalog-cluster__Destinations__catalogServiceDestination__Address: http://catalogservice:8080
      ReverseProxy__Clusters__booking-cluster__Destinations__bookingServiceDestination__Address: http://bookingservice:8080
    depends_on:
      authservice:
        condition: service_started
      catalogservice:
        condition: service_started
      bookingservice:
        condition: service_started
    ports:
      - "5000:8080"

volumes:
  mysql_data:
  booking_mysql_data:
  kafka_data:
