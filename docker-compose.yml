services:
  mysql-dev:
    image: mysql:8.0
    container_name: exvo_mysql_dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: DevPassword123!
      MYSQL_DATABASE: exvo_auth_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data: