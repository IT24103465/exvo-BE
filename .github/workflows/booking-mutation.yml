name: BookingService Mutation Testing

on:
  push:
    branches:
      - testing/mutation-testing
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  booking-mutation:
    name: BookingService mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK and runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore BookingService test dependencies
        run: dotnet restore tests/BookingService.Tests/Exvo.BookingService.Tests.csproj

      - name: Run BookingService tests
        run: dotnet test tests/BookingService.Tests/Exvo.BookingService.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=minimal"

      - name: Run Stryker.NET
        working-directory: tests/BookingService.Tests
        run: dotnet stryker --config-file stryker-config.json --log-to-file

      - name: Upload mutation reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-mutation-${{ github.run_id }}
          path: |
            tests/BookingService.Tests/StrykerOutput/**/reports/mutation-report.html
            tests/BookingService.Tests/StrykerOutput/**/reports/mutation-report.json
            tests/BookingService.Tests/StrykerOutput/**/logs/**
          if-no-files-found: warn
          retention-days: 14
