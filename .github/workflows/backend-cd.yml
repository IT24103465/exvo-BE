name: Backend CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/services/TicketService/**'
      - 'src/services/BookingService/**'
      - 'src/shared/**'
      - '.github/workflows/backend-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP: exvo-be-staging

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      ticket: ${{ steps.manual.outputs.ticket || steps.filter.outputs.ticket }}
      booking: ${{ steps.manual.outputs.booking || steps.filter.outputs.booking }}
    steps:
      - name: Mark all services for manual deployment
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo 'ticket=true' >> "$GITHUB_OUTPUT"
          echo 'booking=true' >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v4
      - name: Filter changed services
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ticket:
              - 'src/services/TicketService/**'
              - 'src/shared/**'
            booking:
              - 'src/services/BookingService/**'
              - 'src/shared/**'

  deploy-ticket-service:
    name: Deploy TicketService
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ticket == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push TicketService image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/services/TicketService/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/exvo-ticketservice:${{ github.sha }}
          cache-from: type=gha,scope=exvo-ticketservice
          cache-to: type=gha,mode=max,scope=exvo-ticketservice
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy TicketService revision
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: exvo-ticketservice
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/exvo-ticketservice:${{ github.sha }}

  deploy-booking-service:
    name: Deploy BookingService
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.booking == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push BookingService image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/services/BookingService/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/exvo-bookingservice:${{ github.sha }}
          cache-from: type=gha,scope=exvo-bookingservice
          cache-to: type=gha,mode=max,scope=exvo-bookingservice
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy BookingService revision
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: exvo-bookingservice
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/exvo-bookingservice:${{ github.sha }}
