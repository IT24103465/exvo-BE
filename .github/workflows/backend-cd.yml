name: Backend CD

on:
  push:
    branches: [main]
    paths:
      - 'src/services/AuthService/**'
      - 'src/services/CatalogService/**'
      - 'src/services/BookingService/**'
      - 'src/services/TicketService/**'
      - 'src/gateway/ApiGateway/**'
      - 'src/shared/**'
      - 'ExvoPlatform.sln'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - 'NuGet.config'
      - '.github/workflows/backend-cd.yml'
  workflow_dispatch:
    inputs:
      service:
        description: Backend service to deploy from main
        required: true
        default: all
        type: choice
        options:
          - all
          - auth
          - catalog
          - booking
          - ticket
          - gateway

permissions:
  contents: read

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Select services to deploy
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Require main for manual deployments
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo 'Manual production deployments must be dispatched from the main branch.' >&2
          exit 1

      - name: Checkout repository
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        if: ${{ github.event_name == 'push' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'src/services/AuthService/**'
              - 'src/shared/**'
              - 'ExvoPlatform.sln'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - 'NuGet.config'
              - '.github/workflows/backend-cd.yml'
            catalog:
              - 'src/services/CatalogService/**'
              - 'src/shared/**'
              - 'ExvoPlatform.sln'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - 'NuGet.config'
              - '.github/workflows/backend-cd.yml'
            booking:
              - 'src/services/BookingService/**'
              - 'src/shared/**'
              - 'ExvoPlatform.sln'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - 'NuGet.config'
              - '.github/workflows/backend-cd.yml'
            ticket:
              - 'src/services/TicketService/**'
              - 'src/shared/**'
              - 'ExvoPlatform.sln'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - 'NuGet.config'
              - '.github/workflows/backend-cd.yml'
            gateway:
              - 'src/gateway/ApiGateway/**'
              - 'src/shared/**'
              - 'ExvoPlatform.sln'
              - '*.props'
              - '*.targets'
              - 'global.json'
              - 'NuGet.config'
              - '.github/workflows/backend-cd.yml'

      - name: Build deployment matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SERVICE: ${{ inputs.service }}
          AUTH_CHANGED: ${{ steps.filter.outputs.auth }}
          CATALOG_CHANGED: ${{ steps.filter.outputs.catalog }}
          BOOKING_CHANGED: ${{ steps.filter.outputs.booking }}
          TICKET_CHANGED: ${{ steps.filter.outputs.ticket }}
          GATEWAY_CHANGED: ${{ steps.filter.outputs.gateway }}
        run: |
          set -euo pipefail
          matrix='[]'

          add_service() {
            local service="$1" display="$2" dockerfile="$3" image="$4"
            matrix=$(jq -c \
              --arg service "$service" \
              --arg display "$display" \
              --arg dockerfile "$dockerfile" \
              --arg image "$image" \
              '. + [{service: $service, display: $display, dockerfile: $dockerfile, image: $image}]' \
              <<< "$matrix")
          }

          selected() {
            local service="$1" changed="$2"
            if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
              [ "$MANUAL_SERVICE" = 'all' ] || [ "$MANUAL_SERVICE" = "$service" ]
            else
              [ "$changed" = 'true' ]
            fi
          }

          selected auth "$AUTH_CHANGED" && add_service auth AuthService src/services/AuthService/Dockerfile exvo-auth
          selected catalog "$CATALOG_CHANGED" && add_service catalog CatalogService src/services/CatalogService/Dockerfile exvo-catalog
          selected booking "$BOOKING_CHANGED" && add_service booking BookingService src/services/BookingService/Dockerfile exvo-bookingservice
          selected ticket "$TICKET_CHANGED" && add_service ticket TicketService src/services/TicketService/Dockerfile exvo-ticketservice
          selected gateway "$GATEWAY_CHANGED" && add_service gateway 'API Gateway' src/gateway/ApiGateway/Dockerfile exvo-gateway

          if [ "$(jq length <<< "$matrix")" -eq 0 ]; then
            echo 'The workflow was triggered, but no deployable backend service was selected.' >&2
            exit 1
          fi

          echo "matrix=$(jq -c '{include: .}' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  validate-production-config:
    name: Validate production configuration
    needs: detect-changes
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_PRODUCTION_RESOURCE_GROUP }}
      AUTH_CONTAINER_APP: ${{ vars.AZURE_PRODUCTION_AUTH_CONTAINER_APP }}
      CATALOG_CONTAINER_APP: ${{ vars.AZURE_PRODUCTION_CATALOG_CONTAINER_APP }}
      BOOKING_CONTAINER_APP: ${{ vars.AZURE_PRODUCTION_BOOKING_CONTAINER_APP }}
      TICKET_CONTAINER_APP: ${{ vars.AZURE_PRODUCTION_TICKET_CONTAINER_APP }}
      GATEWAY_CONTAINER_APP: ${{ vars.AZURE_PRODUCTION_GATEWAY_CONTAINER_APP }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      DEPLOYMENT_MATRIX: ${{ needs.detect-changes.outputs.matrix }}
    steps:
      - name: Check required secrets and variables
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          require_value() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Required GitHub secret or variable $name is not configured."
              missing=1
            fi
          }

          require_value ACR_LOGIN_SERVER "$ACR_LOGIN_SERVER"
          require_value ACR_USERNAME "$ACR_USERNAME"
          require_value ACR_PASSWORD "$ACR_PASSWORD"
          require_value AZURE_CLIENT_ID "$AZURE_CLIENT_ID"
          require_value AZURE_TENANT_ID "$AZURE_TENANT_ID"
          require_value AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          require_value AZURE_PRODUCTION_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"

          while IFS= read -r service; do
            case "$service" in
              auth) require_value AZURE_PRODUCTION_AUTH_CONTAINER_APP "$AUTH_CONTAINER_APP" ;;
              catalog) require_value AZURE_PRODUCTION_CATALOG_CONTAINER_APP "$CATALOG_CONTAINER_APP" ;;
              booking) require_value AZURE_PRODUCTION_BOOKING_CONTAINER_APP "$BOOKING_CONTAINER_APP" ;;
              ticket) require_value AZURE_PRODUCTION_TICKET_CONTAINER_APP "$TICKET_CONTAINER_APP" ;;
              gateway) require_value AZURE_PRODUCTION_GATEWAY_CONTAINER_APP "$GATEWAY_CONTAINER_APP" ;;
              *) echo "::error::Unknown deployment service: $service"; missing=1 ;;
            esac
          done < <(jq -r '.include[].service' <<< "$DEPLOYMENT_MATRIX")

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

  build-and-deploy:
    name: Deploy ${{ matrix.display }}
    needs:
      - detect-changes
      - validate-production-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_PRODUCTION_RESOURCE_GROUP }}
      AUTH_CONTAINER_APP: ${{ vars.AZURE_PRODUCTION_AUTH_CONTAINER_APP }}
      CATALOG_CONTAINER_APP: ${{ vars.AZURE_PRODUCTION_CATALOG_CONTAINER_APP }}
      BOOKING_CONTAINER_APP: ${{ vars.AZURE_PRODUCTION_BOOKING_CONTAINER_APP }}
      TICKET_CONTAINER_APP: ${{ vars.AZURE_PRODUCTION_TICKET_CONTAINER_APP }}
      GATEWAY_CONTAINER_APP: ${{ vars.AZURE_PRODUCTION_GATEWAY_CONTAINER_APP }}
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Container App target
        id: target
        shell: bash
        run: |
          case '${{ matrix.service }}' in
            auth) app="$AUTH_CONTAINER_APP" ;;
            catalog) app="$CATALOG_CONTAINER_APP" ;;
            booking) app="$BOOKING_CONTAINER_APP" ;;
            ticket) app="$TICKET_CONTAINER_APP" ;;
            gateway) app="$GATEWAY_CONTAINER_APP" ;;
            *) echo 'Unknown deployment service.' >&2; exit 1 ;;
          esac
          echo "container_app=$app" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.display }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ${{ matrix.display }} revision
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ steps.target.outputs.container_app }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
