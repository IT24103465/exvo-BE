name: Validate Backend Container Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-images:
    name: Validate ${{ matrix.display }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: AuthService
            dockerfile: src/services/AuthService/Dockerfile
            image: exvo-auth
          - display: CatalogService
            dockerfile: src/services/CatalogService/Dockerfile
            image: exvo-catalog
          - display: BookingService
            dockerfile: src/services/BookingService/Dockerfile
            image: exvo-bookingservice
          - display: CheckInService
            dockerfile: src/services/CheckInService/Dockerfile
            image: exvo-checkinservice
          - display: TicketService
            dockerfile: src/services/TicketService/Dockerfile
            image: exvo-ticketservice
          - display: API Gateway
            dockerfile: src/gateway/ApiGateway/Dockerfile
            image: exvo-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.display }} without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: exvo-validation/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=validation-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=validation-${{ matrix.image }}
